<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fearless Persona</title>
<meta name="description" content="起きて — Fearless Persona.">
<meta name="theme-color" content="#000000">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://fearlesspersona.com/">
<link rel="icon" href="data:,">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Fearless Persona">
<meta property="og:title" content="Fearless Persona">
<meta property="og:description" content="起きて">
<meta property="og:url" content="https://fearlesspersona.com/">
<meta property="og:image" content="https://fearlesspersona.com/fp.png">

<style>
  :root { color-scheme: dark; }

  html, body {
    height: 100%;
    margin: 0;
    background: #000;
  }

  /* position:fixed + overflow:hidden = brak scrolla i brak „gumki” na iOS */
  body {
    position: fixed;
    inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: #050504; /* sumi – czerń z ledwo ciepłym odcieniem */
  }

  /* tekstura papieru: jeden SVG na cały viewport, bez kafelków = bez szwów */
  .paper {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* winieta – miękkie ściemnienie krawędzi */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 80% 75% at 50% 50%, transparent 40%, rgba(0,0,0,.75) 100%);
  }

  .mark {
    position: relative;
    z-index: 1;
    width: clamp(200px, 55vw, 380px);
    height: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.9));
  }
</style>
</head>
<body>
  <main class="stage">

    <svg class="paper" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 1. plamy starzenia: miękkie, mgliste przebarwienia jak na starym pergaminie -->
        <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.0028" numOctaves="5" seed="3"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer>
            <feFuncR type="table" tableValues="0 0 0.05 0.28 0.90"/>
            <feFuncG type="table" tableValues="0 0 0.04 0.23 0.76"/>
            <feFuncB type="table" tableValues="0 0 0.02 0.14 0.52"/>
            <feFuncA type="linear" slope="0" intercept="1"/>
          </feComponentTransfer>
        </filter>

        <!-- 2. żyłki / zagniecenia: nieregularna struktura włókien papirusu -->
        <filter id="veins" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="turbulence" baseFrequency="0.011" numOctaves="3" seed="21"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer>
            <feFuncR type="table" tableValues="0 0 0 0.10 0.55 1"/>
            <feFuncG type="table" tableValues="0 0 0 0.08 0.46 0.86"/>
            <feFuncB type="table" tableValues="0 0 0 0.05 0.30 0.60"/>
            <feFuncA type="linear" slope="0" intercept="1"/>
          </feComponentTransfer>
        </filter>

        <!-- 3. ziarno: drobna faktura papieru -->
        <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="5"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer>
            <feFuncR type="table" tableValues="0 0 0.06 0.40 1"/>
            <feFuncG type="table" tableValues="0 0 0.05 0.34 0.86"/>
            <feFuncB type="table" tableValues="0 0 0.03 0.24 0.62"/>
            <feFuncA type="linear" slope="0" intercept="1"/>
          </feComponentTransfer>
        </filter>
      </defs>

      <rect width="100%" height="100%" filter="url(#mottle)" opacity="0.52"/>
      <rect width="100%" height="100%" filter="url(#veins)"  opacity="0.26"/>
      <rect width="100%" height="100%" filter="url(#grain)"  opacity="0.14"/>
    </svg>

    <div class="vignette" aria-hidden="true"></div>

    <img class="mark" src="fp.png" width="201" height="97" alt="起きて — Fearless Persona" decoding="async" fetchpriority="high">
  </main>
</body>
</html>
