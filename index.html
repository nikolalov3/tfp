<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fearless Persona</title>
<meta name="description" content="起きて — Fearless Persona.">
<meta name="theme-color" content="#000000">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://fearlesspersona.com/">
<link rel="icon" href="data:,">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Fearless Persona">
<meta property="og:title" content="Fearless Persona">
<meta property="og:description" content="起きて">
<meta property="og:url" content="https://fearlesspersona.com/">
<meta property="og:image" content="https://fearlesspersona.com/fp.png">

<style>
  :root { color-scheme: dark; }

  html, body {
    height: 100%;
    margin: 0;
    background: #000;
  }

  /* position:fixed + overflow:hidden = brak scrolla i brak „gumki” na iOS */
  body {
    position: fixed;
    inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: #050504; /* sumi – czerń z ledwo ciepłym odcieniem */
  }

  /* tekstura papieru: jeden SVG na cały viewport, bez kafelków = bez szwów */
  .paper {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* winieta – ściemnienie rogów jak przy odbitce drzeworytu */
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 80% 75% at 50% 50%, transparent 35%, rgba(0,0,0,.8) 100%);
  }

  .mark {
    position: relative;
    z-index: 1;
    width: clamp(200px, 55vw, 380px);
    height: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.9));
  }
</style>
</head>
<body>
  <main class="stage">

    <svg class="paper" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 1. plamy / starzenie: duże mgliste nierówności jak na starym washi -->
        <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.0035" numOctaves="4" seed="3"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer>
            <feFuncR type="table" tableValues="0 0 0.06 0.30 0.95"/>
            <feFuncG type="table" tableValues="0 0 0.05 0.25 0.82"/>
            <feFuncB type="table" tableValues="0 0 0.03 0.17 0.60"/>
            <feFuncA type="linear" slope="0" intercept="1"/>
          </feComponentTransfer>
        </filter>

        <!-- 2. włókna: poziome smugi jak włókna morwy w papierze japońskim -->
        <filter id="fiber" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.005 0.55" numOctaves="2" seed="11"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer>
            <feFuncR type="table" tableValues="0 0 0 0.18 0.95"/>
            <feFuncG type="table" tableValues="0 0 0 0.15 0.85"/>
            <feFuncB type="table" tableValues="0 0 0 0.10 0.65"/>
            <feFuncA type="linear" slope="0" intercept="1"/>
          </feComponentTransfer>
        </filter>

        <!-- 3. ziarno: drobny szum papieru -->
        <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5"/>
          <feColorMatrix type="saturate" values="0"/>
          <feComponentTransfer>
            <feFuncR type="table" tableValues="0 0 0.08 0.45 1"/>
            <feFuncG type="table" tableValues="0 0 0.07 0.40 0.9"/>
            <feFuncB type="table" tableValues="0 0 0.05 0.30 0.7"/>
            <feFuncA type="linear" slope="0" intercept="1"/>
          </feComponentTransfer>
        </filter>

        <!-- 4. szrafowanie ryciny: skośne, lekko drżące linie, tylko przy krawędziach -->
        <pattern id="hatchP" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-32)">
          <rect width="5" height="1" fill="#f3e6d2"/>
        </pattern>
        <filter id="wobble" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <radialGradient id="edgeG" cx="50%" cy="50%" r="60%" fx="50%" fy="50%">
          <stop offset="30%" stop-color="#000"/>
          <stop offset="100%" stop-color="#fff"/>
        </radialGradient>
        <mask id="edgeM" maskContentUnits="userSpaceOnUse">
          <rect width="100%" height="100%" fill="url(#edgeG)"/>
        </mask>
      </defs>

      <rect width="100%" height="100%" filter="url(#mottle)" opacity="0.55"/>
      <rect width="100%" height="100%" filter="url(#fiber)"  opacity="0.32"/>
      <rect width="100%" height="100%" filter="url(#grain)"  opacity="0.16"/>
      <rect width="100%" height="100%" fill="url(#hatchP)" filter="url(#wobble)" mask="url(#edgeM)" opacity="0.085"/>
    </svg>

    <div class="vignette" aria-hidden="true"></div>

    <img class="mark" src="fp.png" width="201" height="97" alt="起きて — Fearless Persona" decoding="async" fetchpriority="high">
  </main>
</body>
</html>
